name: Phase 14 Sentinel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Verify Docker Environment
      run: |
        docker --version
        echo "Pipeline is Ready for Sentinel Validation"

    - name: Security Linting
      run: |
        pip install bandit
        bandit -r scripts/
