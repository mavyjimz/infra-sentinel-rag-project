name: Sentinel RAG CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  security_audit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Security Audit
        # This is where we prove our # nosec and literal strings work!
        run: bandit -r scripts/ -ll

  build_and_push:
    name: Cloud Docker Build
    needs: security_audit # The "Gatekeeper" - only builds if scan passes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sentinel-rag-app:latest
          # Layer caching makes the 4.02 GB image build faster next time!
          cache-from: type=gha
          cache-to: type=gha,mode=max
